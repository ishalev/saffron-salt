    case 'speed': ui.setup.speed = el.dataset.v; break;
    case 'start': {
      const seats = ui.setup.seats.slice(0, ui.setup.n).map((s, i) => ({ name: s.name.trim() || (s.human ? `Player ${i + 1}` : BOT_NAMES[i]), human: s.human }));
      startGame({ seed: ui.setup.seed.trim() || randomSeed(), seats, botRule: ui.setup.botRule, botScoring: ui.setup.botScoring });
      ui.setup.seed = randomSeed();
      return;
    }
    case 'tutorial': startGame({ seed: 'walkthrough-1', seats: [{ name: 'You', human: true }, { name: 'Clove', human: false }, { name: 'Mace', human: false }], botRule: 'notLeadingNoSaffron', tutorial: true }); return;
    case 'rules': ui.modal = { type: 'rules' }; break;
    case 'log': ui.modal = { type: 'log' }; break;
    case 'closeModal': if (!['handoff', 'bidsIn', 'season'].includes(ui.modal?.type)) ui.modal = null; break;
    case 'pause': ui.paused = !ui.paused; break;
    case 'quit': ui.modal = { type: 'quit' }; break;
    case 'quitYes': quitToHome(); return;
    case 'home': quitToHome(); return;
    case 'openSim': ui.view = 'sim'; break;
    case 'openLoad': ui.view = 'load'; ui.replayError = null; break;
    case 'openLogs': ui.gen++; ui.view = 'logs'; ui.viewOnly = null; ui.logs.err = null; if (ui.logs.tab === 'server' && !ui.logs.server && ui.logs.pw) loadServerGames(); break;
    case 'logsTab': ui.logs.tab = el.dataset.v; ui.logs.err = null; if (ui.logs.tab === 'server' && !ui.logs.server) { try { ui.logs.pw = ui.logs.pw || sessionStorage.getItem('ss-pw') || ''; } catch { } if (ui.logs.pw) { loadServerGames(); return; } } break;
    case 'logsLogin': loadServerGames(); return;
    case 'logsReload': loadServerGames(); return;
    case 'logSummary': openGameRecord(el.dataset.src, el.dataset.id, 'summary'); return;
    case 'logReplayRow': openGameRecord(el.dataset.src, el.dataset.id, 'replay'); return;
    case 'logReplay': if (ui.viewOnly?.replay) { ui.replayText = JSON.stringify(ui.viewOnly.replay); startReplay(); } return;
    case 'simCount': { const n = +el.dataset.v; const c = ui.sim.counts; ui.sim.counts = c.includes(n) ? c.filter(x => x !== n) : [...c, n]; break; }
    case 'simGames': ui.sim.games = +el.dataset.v; break;
    case 'runSim': runSim(); return;
    case 'saveSim': saveFile('saffron-salt-simulation.md', ui.sim.report.md); return;
    case 'watchReplay': startReplay(); return;
    case 'handoffGo': { const m = ui.modal; ui.modal = null; render(); m.res(); return; }
    case 'coachOk': { const c = ui.coach; ui.coach = null; render(); c?.res(); return; }
    case 'coachOff': { const c = ui.coach; ui.coach = null; ui.tutorial = false; render(); c?.res(); return; }
    case 'seasonOk': { const m = ui.modal; ui.modal = null; render(); m?.res?.(); return; }
    case 'revealBids': ui.bidRound?.reveal(); return;
    case 'changeBid': { const k = +el.dataset.k; ui.modal = null; ui.viewer = null; ui.bidRound?.undo(k); return; }
    case 'undoBid': { const br = ui.bidRound; if (br && ui.myBid) { const k = br.list.findIndex(([i]) => i === ui.myBid.i); br.undo(k); } return; }
    case 'guestUndo': guestUndoBid(); return;
    case 'saveLog': { const lines = ui.result?.log || g?.log || []; saveFile(`saffron-salt-${(ui.result?.seed || g?.seed || 'game')}.txt`, lines.join('\n')); return; }
    case 'saveReplay': {
      const r = ui.result; if (!r) return;
      if (ui.viewOnly?.replay) saveFile(`saffron-salt-${r.seed}-replay.json`, JSON.stringify(ui.viewOnly.replay, null, 1));
      else if (g && r.decisions) saveFile(`saffron-salt-${r.seed}-replay.json`, replayJSON(r, g));
      return;
    }
    case 'again': startGame({ seed: randomSeed(), seats: ui.lastSettings.seats, botRule: ui.lastSettings.botRule, botScoring: ui.lastSettings.botScoring, online: ui.online.role === 'host' }); return;
    case 'sameSeed': startGame({ seed: ui.result.seed, seats: ui.lastSettings.seats, botRule: ui.lastSettings.botRule, botScoring: ui.lastSettings.botScoring, online: ui.online.role === 'host' }); return;
    case 'clearSel': ui.sel = []; break;
    case 'openOnline': ui.view = 'online'; ui.online.status = ui.online.status === 'ready' ? 'ready' : 'connecting'; netConnect().then(ok => { ui.online.status = ok ? 'ready' : 'none'; if (ui.view === 'online') render(); }); break;
    case 'hostCreate': hostCreate(); return;
    case 'guestJoin': guestJoin(); return;
    case 'lobKind': hostSetKind(+el.dataset.i, el.dataset.v); break;
    case 'hostStart': hostStart(); return;
    case 'leaveOnline': leaveOnline(); ui.view = 'online'; ui.online.status = 'ready'; break;
    case 'leaveGame': ui.modal = { type: 'leave' }; break;
    case 'leaveYes': ui.modal = null; quitToHome(); return;
    case 'botTake': hostBotTakeover(+el.dataset.i); return;
    case 'fbSend': fbSend(); return;
    case 'selCard': {
      if (!p) return;
      const n = +el.dataset.n;
      if (p.req.type === 'bid') ui.sel = ui.sel.includes(n) ? ui.sel.filter(x => x !== n) : ui.sel.length >= 2 ? [ui.sel[1], n] : [...ui.sel, n];
      else ui.sel = [n];
      break;
    }
    case 'selLot': ui.sel = [el.dataset.id]; break;
    case 'selOpt': ui.sel = [+el.dataset.k]; break;
    case 'confirm': {
      if (!p) return;
      const t = p.req.type;
      if (t === 'seed' && ui.sel.length === 1) p.resolve(ui.sel[0]);
      else if (t === 'bid') p.resolve(ui.sel.slice());
      else if ((t === 'lot' || t === 'botLot') && ui.sel.length) p.resolve(ui.sel[0]);
      else if ((t === 'order' || t === 'endOrder') && ui.sel.length) p.resolve(p.req.groups[ui.sel[0]].order);
      else if (t === 'store' && ui.sel.length) p.resolve(ui.sel[0]);
      return;
    }
    default: return;
  }
  render();
}
setInterval(() => { if (ui.view === 'table' && !ui.anim && !ui.scoreFx && ((ui.toast && Date.now() - ui.toast.at < 3000) || Date.now() - ui.movedAt < 3000)) { const y = window.scrollY; renderTable(); window.scrollTo(0, y); } }, 1200);

// ================= Rules text =================
const RULES_HTML = `<button class="btn small close" data-act="closeModal">Close</button>
<h2 id="rt">How to play Saffron Salt</h2>
<p class="muted">Version ${RULES_VERSION}, adapted for the digital edition. Points replace the physical coins.</p>
<h3>Goal</h3>
<p>Over three seasons, bid for lots of spice cards, climb the seven spice tracks, and earn the most points.</p>
<h3>The cards</h3>
<p>The deck has 83 cards numbered 1 to 83. Cards 1 to 78 are spices: Chili (1–19), Cinnamon (20–34), Garlic (35–46), Turmeric (47–56), Oregano (57–65), Curry (66–73) and Saffron (74–78). Cards 79 to 83 are coin cards worth 2, 5 or 7 points. Coin cards count as their own suit when bidding.</p>
<p>The top card of each spice except Saffron has a double icon and moves you two spaces. Some cards show a salt shaker. The badge at the bottom shows how many extra cards the card adds to its lot when it enters the market. Every card in a lot is dealt faceup.</p>
<h3>Setup</h3>
<p>Every marker starts on the bottom space of each track. Neutral cubes take up spaces: in 2–3 player games, place one on the "2/3" space and one on the "4" space of every track except Saffron; in 4-player games, only on the "4" space (Curry has no "4" cube). In 2–3 player games, also place a cube on space 4 of the Saffron track, leaving one empty space above the MOQ. Five-player games use no cubes. Each player is dealt 7 cards and places one into the market. In 2-player games, the top card of the deck is also placed in the market for the Deck Bot.</p>
<h3>The market</h3>
<p>Each market card is the base of a lot: deal the extra cards shown on its badge next to it. When the base card is Saffron or a coin, lay it sideways as a reminder that it can’t be stored. After a season’s last auction, the new base cards wait without extra cards until end-of-season storage is finished.</p>
<h3>An auction</h3>
<p>There are three auctions per season. In each one:</p>
<ol>
<li><strong>Bid.</strong> Everyone secretly bids one card, or two cards of the same spice. Any pair beats any single; otherwise the higher card number wins. Keep enough cards in hand to bid in the remaining auctions.</li>
<li><strong>Buy.</strong> In bid order, highest first, each player buys one lot. Cash any coin cards for points. For each spice card, move your marker up its track (two spaces for a double icon). Then keep one card from the lot in storage, except that a Saffron or coin base card can’t be kept. Discard the rest.</li>
<li><strong>Restock.</strong> The bids become the new market: from each pair, the higher card goes to the market and the lower is discarded.</li>
</ol>
<h3>Moving on the tracks</h3>
<p>Cards move you only when you buy them in a lot, or when they’re left in your hand at the end of a season. Storing a card never moves you.</p>
<p>When you move, skip any space with another marker or a neutral cube on it; skipped spaces don't count. <strong>Salt:</strong> a card with a salt shaker can't skip. If the space directly above you is occupied, that movement is lost.</p>
<p><strong>The top space</strong> pays points each time you reach it (5 on Saffron, 2 elsewhere), and again for each movement you would make while already there. If you reach the top while another marker is on it, that marker is knocked down to the MOQ space. Markers can share only the start space and the MOQ space, and only knocked-down markers share the MOQ.</p>
<h3>End of a season</h3>
<p><strong>Storage.</strong> In order of the best bid each hand could make, players reveal the cards left in hand and move up the tracks for each one, then discard them.</p>
<p><strong>Scoring.</strong> On each track, the single player furthest ahead scores the lead bonus on the tab: 7 for Saffron, 5 for the rest. If the furthest markers are tied (only possible on the start space), nobody leads. Every other player at or above the MOQ (Minimum Order Quantity) space scores 2. A leader doesn't also score the MOQ.</p>
<p>Then the waiting lots get their extra cards. After seasons 1 and 2, your stored cards return to your hand and you're dealt 3 more.</p>
<h3>End of the game</h3>
<p><strong>Cash-out.</strong> After season 3, everyone reveals their three stored cards and makes the best bid they can. Points by rank: 2–3 players 7 / 2 / 0; 4 players 10 / 5 / 2 / 0; 5 players 15 / 10 / 5 / 2 / 0.</p>
<p><strong>Specialization.</strong> Score a bonus for tracks your marker never left: 7 for one, 17 for two, 30 for three or more.</p>
<p>Most points wins.</p>
<h3>Two players: the Deck Bot</h3>
<p>The Deck Bot is a third bidder run from the deck. To bid, flip a card; if it's 57 or higher, flip one more, otherwise flip two more. Its bid is the best bid among those cards, and its highest bid card goes to the market afterward. If the bot bids highest, the lowest bidder chooses its lot; if it's second, the highest bidder chooses; if it's last, it gets the remaining lot. The bot moves on the tracks like a player but stores nothing. At the end of each season it goes first in storage: it advances one space on each track it is not leading, except Saffron (a tie for the lead counts as not leading). It scores like a player, and you must be ahead of it to lead a track. You can choose to play without keeping the bot’s score: it still moves and blocks leads, but scores nothing.</p>`;

render();
