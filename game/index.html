<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saffron Salt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Playfair+Display:wght@700;800&family=Playfair+Display+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #fbf6ee; --panel: #ffffff; --ink: #3a2a20; --muted: #85725f; --line: #dccdb9; --shade: #f2e8da;
  --saffron: #c8232c; --curry: #d2692a; --oregano: #1e6b3c; --turmeric: #dc9c1f; --garlic: #a8a330; --cinnamon: #6e3b1e; --chili: #8c1d2b;
  --gold: #c99a3b; --silver: #9aa0a6; --focus: #1f72b8;
  --num: 'Oswald', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --sc: 'Playfair Display SC', Georgia, serif;
  --body: 'Oswald', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1f1914; --panel: #2a221b; --ink: #f1e6d6; --muted: #b4a28c; --line: #4a3d31; --shade: #342a21;
    --saffron: #ec5a5f; --curry: #ec8a4c; --oregano: #5fb27c; --turmeric: #efbc4f; --garlic: #cfc95a; --cinnamon: #c48a62; --chili: #e06474;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1f1914; --panel: #2a221b; --ink: #f1e6d6; --muted: #b4a28c; --line: #4a3d31; --shade: #342a21;
  --saffron: #ec5a5f; --curry: #ec8a4c; --oregano: #5fb27c; --turmeric: #efbc4f; --garlic: #cfc95a; --cinnamon: #c48a62; --chili: #e06474;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-weight: 300; font-size: 16px; line-height: 1.45; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.s-saffron { --c: var(--saffron); } .s-curry { --c: var(--curry); } .s-oregano { --c: var(--oregano); } .s-turmeric { --c: var(--turmeric); }
.s-garlic { --c: var(--garlic); } .s-cinnamon { --c: var(--cinnamon); } .s-chili { --c: var(--chili); } .s-coin { --c: var(--gold); }
svg.ic { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.12em; }

.btn { border: 1.5px solid var(--ink); background: transparent; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-weight: 400; letter-spacing: .02em; }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.small { padding: 4px 10px; font-size: 14px; }
.link { background: none; border: none; padding: 4px 6px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }
.muted { color: var(--muted); }

/* ---------- Home ---------- */
.home { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
.title { font-family: var(--serif); font-weight: 800; font-size: clamp(48px, 9vw, 96px); line-height: .95; margin: 0; letter-spacing: -.01em; }
.title .salt { color: var(--muted); }
.spice-row { display: flex; gap: 14px; font-size: 28px; margin: 18px 0 8px; flex-wrap: wrap; }
.spice-row span { color: var(--c); }
.tag { font-size: 19px; max-width: 46ch; margin: 6px 0 28px; }
.home-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 28px; align-items: start; }
@media (max-width: 760px) { .home-grid { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 20px; }
.panel h2 { font-family: var(--serif); font-size: 26px; margin: 0 0 14px; }
.field { margin: 0 0 16px; }
.field > label, .field > .lbl { display: block; font-weight: 400; margin-bottom: 6px; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; }
.seg button { border: none; background: transparent; padding: 6px 14px; cursor: pointer; }
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seat { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; margin-bottom: 8px; }
.dot { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
input[type=text], select, textarea { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 6px; padding: 6px 10px; width: 100%; }
textarea { min-height: 140px; font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.side-actions { display: grid; gap: 12px; }
.side-actions .panel h2 { font-size: 21px; margin-bottom: 6px; }
.side-actions p { margin: 0 0 12px; }
details summary { cursor: pointer; font-weight: 400; }

/* ---------- Table ---------- */
.bar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1.5px solid var(--line); background: var(--panel); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; flex-wrap: wrap; }
.brand { font-family: var(--serif); font-weight: 800; font-size: 20px; }
.phase { font-weight: 400; }
.phase .pips { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: 1px; }
.phase .pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-block; }
.phase .pips i.on { background: var(--ink); }
.bar .spacer { flex: 1; }
.scores { display: flex; gap: 8px; padding: 10px 16px; flex-wrap: wrap; }
.chip { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 8px; padding: 4px 10px 4px 6px; background: var(--panel); }
.chip.active { border-color: var(--ink); }
.chip .nm { font-weight: 400; }
.chip .sc { font-family: var(--num); font-size: 22px; font-weight: 400; line-height: 1; }
.chip .meta { font-size: 13px; color: var(--muted); }
@media (max-width: 640px) { .chip .meta { display: none; } }
.stage { max-width: 1180px; margin: 0 auto; padding: 0 16px 18px; display: grid; gap: 14px; }
.mkrow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.mkrow.withbids { grid-template-columns: minmax(0, 1fr) 250px; }
@media (max-width: 820px) { .mkrow.withbids { grid-template-columns: 1fr; } }
.lower { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 0 16px 24px; max-width: 1400px; margin: 0 auto; align-items: start; }
@media (max-width: 1100px) { .lower { grid-template-columns: 1fr; } }
.box.market { border: 2px solid var(--ink); padding: 14px 16px 16px; }
.market h4 { font-size: 22px; text-align: center; margin-bottom: 12px; }
.market .lots { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.market .lot { flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px; }
.market .lot .ln { width: auto; font-size: 15px; color: var(--ink); }

.board { overflow-x: auto; background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; }
.tracks { display: flex; gap: 8px; min-width: 660px; align-items: flex-start; }
.track { flex: 1 1 0; min-width: 84px; --tint: color-mix(in srgb, var(--c) 13%, var(--panel)); background: var(--tint); border-radius: 10px; padding: 6px 6px 8px; }
.thead { text-align: center; color: var(--c); margin-bottom: 6px; }
.thead .lead { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: #fff; font-family: var(--num); font-weight: 500; font-size: 15px; }
.thead .tn { font-family: var(--serif); font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 2px; }
.sp { position: relative; height: 30px; border: 1.5px solid var(--c); background: var(--panel); border-radius: 3px; margin: 0 4px 4px; display: flex; align-items: center; justify-content: center; gap: 3px; flex-wrap: wrap; padding: 2px; }
.sp .lbl { position: absolute; left: 4px; top: 1px; font-size: 10px; color: var(--muted); pointer-events: none; }
.sp .ghost { position: absolute; inset: 0; display: grid; place-items: center; color: var(--c); opacity: .22; font-size: 18px; pointer-events: none; }
.sp.top { border-style: dashed; }
.sp.top .ghost { opacity: .9; }
.coin { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-family: var(--num); font-weight: 500; font-size: 13px; color: #fff; background: var(--silver); }
.coin.gold { background: var(--gold); }
.sp.moq { margin: 0 0 4px; border-radius: 6px; border-width: 2px; background: color-mix(in srgb, var(--c) 8%, var(--panel)); }
.sp.start { margin: 0 0 0; border-radius: 6px; border-width: 2px; background: color-mix(in srgb, var(--c) 22%, var(--panel)); }
.mk { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 10px; font-weight: 500; border: 1.5px solid rgba(0,0,0,.25); position: relative; z-index: 1; }
.mk.neutral { border-radius: 3px; background: #9a958c; width: 15px; height: 15px; }
.mk.moved { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink); }
.mk.blocked::after { content: ''; position: absolute; inset: -5px; border: 2px dashed var(--saffron); border-radius: 50%; }
@media (prefers-reduced-motion: no-preference) { .mk.moved { animation: pop .5s ease-out; } @keyframes pop { from { transform: scale(1.6); } to { transform: scale(1); } } }

.side { display: grid; gap: 16px; align-content: start; }
.prompt { background: var(--shade); border-radius: 10px; padding: 10px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; align-items: center; }
.prompt > :not(.actions) { grid-column: 1; }
.prompt > .actions { grid-column: 2; grid-row: 1 / span 4; margin-top: 0 !important; }
@media (max-width: 640px) { .prompt { grid-template-columns: 1fr; } .prompt > .actions { grid-column: 1; grid-row: auto; margin-top: 8px !important; } }
.prompt h3 { font-family: var(--serif); font-size: 20px; margin: 0 0 2px; }
.prompt p { margin: 0 0 4px; }
.prompt .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.opt { display: block; width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
.opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.box { background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.box h4 { font-family: var(--serif); font-size: 17px; margin: 0 0 8px; }
.lots { display: grid; gap: 8px; }
.lot { display: flex; gap: 8px; align-items: center; border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--paper); }
.lot .ln { font-family: var(--num); font-size: 13px; color: var(--muted); width: 40px; }
.lot.pick { cursor: pointer; }
.lot.pick:hover { border-color: var(--muted); }
.lot[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.cards { display: flex; gap: 6px; flex-wrap: wrap; }
.bids { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.bids li { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.bids .rk { font-family: var(--num); font-weight: 500; width: 18px; }
.ticker { font-size: 14px; color: var(--muted); max-height: 140px; overflow: auto; }
.ticker div { padding: 2px 0; border-bottom: 1px dotted var(--line); }

/* ---------- Cards ---------- */
.card { --w: 64px; width: var(--w); height: calc(var(--w) * 1.36); border: 1.5px solid var(--c, var(--line)); border-radius: 6px; background: var(--panel); position: relative; color: var(--c); flex: none; overflow: hidden; }
.card.sm { --w: 46px; }
.card .cn { position: absolute; left: 5px; top: 1px; font-family: var(--num); font-weight: 300; font-size: calc(var(--w) * .36); line-height: 1.1; }
.card .ci { position: absolute; right: 4px; top: 5px; display: flex; flex-direction: column; gap: 1px; font-size: calc(var(--w) * .2); }
.card .cs { position: absolute; left: 5px; bottom: calc(var(--w) * .34); font-size: calc(var(--w) * .2); color: var(--ink); }
.card .cnm { position: absolute; left: 0; right: 0; bottom: calc(var(--w) * .2); text-align: center; font-family: var(--sc); font-size: calc(var(--w) * .13); letter-spacing: .06em; }
.card .cseas { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); font-family: var(--num); font-size: calc(var(--w) * .16); line-height: 1; padding: 1px 4px; border-radius: 3px; border: 1px solid var(--ink); color: var(--ink); background: var(--panel); }
.card .cseas.fd { background: var(--ink); color: var(--panel); }
.card .cbig { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--w) * .42); opacity: .14; }
.card.coinc .cbig { opacity: 1; }
.card.coinc .cbig .coin { width: calc(var(--w) * .5); height: calc(var(--w) * .5); font-size: calc(var(--w) * .26); }
.card.back { --c: var(--muted); background: repeating-linear-gradient(45deg, var(--shade) 0 5px, var(--panel) 5px 10px); display: grid; place-items: center; }
.card.back span { font-family: var(--serif); font-weight: 800; color: var(--muted); font-size: calc(var(--w) * .3); }
.card.pick { cursor: pointer; }
.card.sel { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink); transform: translateY(-4px); }
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .12s; } }
.card .ord { position: absolute; right: 3px; bottom: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 11px; display: grid; place-items: center; }

.hand { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; }
@media (max-width: 820px) { .hand { grid-template-columns: 1fr; } }
.hands { display: grid; gap: 12px; }
.hand .cards { gap: 10px; }
.hand .card { --w: 76px; }
.slots { display: flex; gap: 10px; }
.slot { --w: 76px; width: var(--w); height: calc(var(--w) * 1.36); border: 1.5px dashed var(--line); border-radius: 6px; }

/* ---------- Overlays ---------- */
.scrim { position: fixed; inset: 0; background: rgba(30, 20, 12, .45); z-index: 20; display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--panel); color: var(--ink); border-radius: 12px; max-width: 760px; width: 100%; max-height: calc(100% - 32px); overflow: auto; padding: 22px 24px; border: 1.5px solid var(--line); }
.dialog h2 { font-family: var(--serif); margin: 0 0 10px; font-size: 28px; }
.dialog h3 { font-family: var(--serif); margin: 20px 0 6px; font-size: 19px; }
.dialog p, .dialog li { max-width: 68ch; }
.dialog .close { float: right; }
.coach { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 15; max-width: 380px; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 16px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.coach h4 { font-family: var(--serif); margin: 0 0 6px; font-size: 19px; }
.coach p { margin: 0 0 12px; }
.coach .btn { border-color: var(--paper); color: var(--paper); }
.loglist { font-size: 14px; }
.loglist div { padding: 2px 0; }
.loglist .hd { font-weight: 500; margin-top: 8px; }

/* ---------- Results ---------- */
.results { max-width: 1060px; margin: 0 auto; padding: 24px 16px 64px; }
.results h1 { font-family: var(--serif); font-size: 44px; margin: 0 0 6px; }
.podium { display: grid; gap: 6px; margin: 16px 0 24px; }
.podium .pl { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; font-size: 20px; }
.podium .pl .rk { font-family: var(--num); font-size: 26px; font-weight: 500; }
.podium .pl .pts { font-family: var(--num); font-size: 30px; font-weight: 400; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
.scroll { overflow-x: auto; }
table.st { border-collapse: collapse; width: 100%; font-size: 15px; }
table.st th, table.st td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; }
table.st th:first-child, table.st td:first-child { text-align: left; }
table.st th { font-weight: 400; color: var(--muted); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.progress { height: 10px; border-radius: 5px; background: var(--shade); overflow: hidden; }
.progress div { height: 100%; background: var(--ink); }
.simblock { margin-top: 18px; }
.simblock h3 { font-family: var(--serif); font-size: 22px; margin: 0 0 6px; }
.simblock ul { margin: 0 0 10px; padding-left: 18px; }

/* ---------- v1.21a additions ---------- */
.stepline { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.stepbig { font-family: var(--serif); font-weight: 800; font-size: 24px; }
.stepnow { font-size: 18px; font-weight: 400; }
.toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 12; background: var(--ink); color: var(--paper); padding: 10px 20px; border-radius: 999px; font-size: 17px; font-weight: 400; box-shadow: 0 6px 20px rgba(0,0,0,.2); animation: toast 2.6s ease forwards; pointer-events: none; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -8px); } 10%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
.chip .spec { font-family: var(--num); font-size: 15px; color: var(--muted); margin-left: -4px; cursor: help; }
.check { display: flex; gap: 8px; align-items: baseline; font-weight: 300; }
.check input { width: auto; }
.seasonbox { border: 2px solid var(--gold); }
.card.bidcard { transform: translateY(-8px); box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--gold); }
.bidtag { position: absolute; left: 50%; top: -1px; transform: translateX(-50%); background: var(--gold); color: #fff; font-size: 10px; padding: 0 5px; border-radius: 0 0 4px 4px; white-space: nowrap; font-weight: 500; }
.card.land { width: calc(var(--w) * 1.36); height: var(--w); }
.card.land .cnm { bottom: calc(var(--w) * .22); }
.landtag { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); background: var(--muted); color: var(--panel); font-size: 9px; padding: 0 4px; border-radius: 3px; white-space: nowrap; }
.card.slotcard { border-style: dashed; display: grid; place-items: center; color: var(--muted); --c: var(--line); }
.track.scoring { box-shadow: 0 0 0 3px var(--gold); }
.track.active { box-shadow: 0 0 0 2px var(--ink); }
.thead .tlead { font-size: 11px; color: var(--muted); margin-top: 2px; min-height: 14px; }
.sp { overflow: visible; }
.fx { position: absolute; left: 50%; bottom: calc(100% + 2px); transform: translateX(-50%); z-index: 4; white-space: nowrap; font-size: 12px; font-weight: 500; padding: 2px 7px; border-radius: 999px; background: var(--ink); color: var(--paper); pointer-events: none; }
.fx-knock { background: var(--saffron); color: #fff; }
.fx-top { background: var(--gold); color: #fff; }
.fx-lead { background: #b8860b; color: #fff; }
.fx-moq { background: var(--oregano); color: #fff; }
.fx-skip { background: var(--focus); color: #fff; }
.fx-salt { background: #6b6b6b; color: #fff; }
.fx-score { background: var(--gold); color: #fff; bottom: calc(100% + 26px); }
@media (prefers-reduced-motion: no-preference) {
  .fx { animation: fxin .18s ease-out; }
  @keyframes fxin { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .mk.moving.mv-step { animation: step .35s ease-out; }
  .mk.moving.mv-skip { animation: hop .55s ease-out; }
  .mk.moving.mv-salt { animation: shake .4s ease-in-out; }
  .mk.knocked { animation: knock .6s ease-out; }
  .mk.scored { animation: glow 1s ease-in-out infinite alternate; }
  @keyframes step { from { transform: translateY(14px); } to { transform: none; } }
  @keyframes hop { 0% { transform: translateY(30px) scale(1); } 50% { transform: translateY(-10px) scale(1.35); } 100% { transform: none; } }
  @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @keyframes knock { 0% { transform: translateY(-40px) rotate(-30deg); opacity: .4; } 100% { transform: none; opacity: 1; } }
  @keyframes glow { from { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--gold); } to { box-shadow: 0 0 0 2px var(--paper), 0 0 0 7px var(--gold); } }
}
.mk.moving { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink); z-index: 3; }
.mk.moved { animation: fadering 2.6s linear forwards !important; }
@keyframes fadering { from { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); } to { box-shadow: 0 0 0 2px transparent, 0 0 0 4px transparent; } }
.mk.knocked { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--saffron); }
.mk.preview { background: transparent !important; border: 2px dashed; font-weight: 600; }
.pv { margin-top: 6px; padding: 8px 10px; border: 1.5px dashed var(--muted); border-radius: 8px; font-size: 15px; }
.orderprompt { grid-template-columns: 1fr; }
.orderprompt > .actions { grid-column: 1; grid-row: auto; margin-top: 8px !important; }
.opt.rec { border-color: var(--oregano); box-shadow: inset 0 0 0 1px var(--oregano); }

.optcards { display: flex; flex-direction: column; gap: 6px; }

.cashout { margin: 10px 0 0; font-size: 14px; color: var(--muted); }

/* ---------- v1.21c ---------- */
.home-main { display: grid; gap: 18px; align-content: start; }
.panel.featured { border: 2.5px solid var(--ink); padding: 26px 26px 28px; background: color-mix(in srgb, var(--gold) 10%, var(--panel)); }
.panel.featured h2 { font-size: 40px; margin-bottom: 8px; }
.panel.featured p { font-size: 19px; margin: 0 0 18px; max-width: 46ch; }
.btn.big { font-size: 19px; padding: 12px 24px; }
.fx { font-size: 16px !important; font-weight: 600 !important; padding: 5px 12px !important; box-shadow: 0 4px 14px rgba(0,0,0,.28); bottom: calc(100% + 6px); }
.fx-score { color: #fff !important; }
.mk.moving { transform: scale(1.55); }
.mk.scored { transform: scale(1.35); }
@media (prefers-reduced-motion: no-preference) {
  .mk.moving.mv-step { animation: step2 .45s ease-out forwards; }
  .mk.moving.mv-skip { animation: hop2 .7s ease-out forwards; }
  .mk.moving.mv-salt { animation: shake2 .5s ease-in-out forwards; }
  @keyframes step2 { from { transform: translateY(22px) scale(1.2); } to { transform: scale(1.55); } }
  @keyframes hop2 { 0% { transform: translateY(44px) scale(1.2); } 50% { transform: translateY(-18px) scale(1.9); } 100% { transform: scale(1.55); } }
  @keyframes shake2 { 0%, 100% { transform: scale(1.55); } 25% { transform: translateX(-7px) scale(1.55); } 75% { transform: translateX(7px) scale(1.55); } }
  .mk.scored { animation: glow2 .9s ease-in-out infinite alternate; }
  @keyframes glow2 { from { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--pc, var(--gold)); } to { box-shadow: 0 0 0 3px var(--paper), 0 0 0 10px var(--pc, var(--gold)); } }
}
.callout { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 13; width: max-content; max-width: min(760px, calc(100% - 32px)); padding: 14px 20px; border: 4px solid; border-radius: 12px; background: var(--panel); font-size: 24px; line-height: 1.3; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.callout .cdot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
.moment-box .momentline { font-size: 20px; font-weight: 400; }
.ticker .moment { font-weight: 500; color: var(--ink); }
.ticker .moment::before { content: '» '; color: var(--gold); }
</style>

<body>
<div id="app"></div>
<div id="overlay"></div>
<script type="module">
// Saffron Salt — rules engine, v1.21a
// Rules v1.20b board + decisions logged for v1.21a (see the Issues and Decisions Log).
// Runs in Node and the browser. No dependencies.

const ENGINE_VERSION = '0.3.0';
const RULES_VERSION = '1.21c';

const SPICES = ['saffron', 'curry', 'oregano', 'turmeric', 'garlic', 'cinnamon', 'chili'];
const SUIT_NAME = {
  saffron: 'Saffron', curry: 'Curry', oregano: 'Oregano', turmeric: 'Turmeric',
  garlic: 'Garlic', cinnamon: 'Cinnamon', chili: 'Chili', coin: 'Coin',
};
// Spaces numbered from the bottom: 1 = start, len = top.
// n23 / n4 = spaces of the "2/3" and "4" neutral cubes. instant = points on reaching / moving at the top.
const TRACKS = {
  saffron:  { len: 7,  moq: 2, instant: 5, lead: 7, n23: null, n4: null },
  curry:    { len: 8,  moq: 4, instant: 2, lead: 5, n23: 6, n4: null },
  oregano:  { len: 9,  moq: 5, instant: 2, lead: 5, n23: 7, n4: 3 },
  turmeric: { len: 11, moq: 7, instant: 2, lead: 5, n23: 9, n4: 5 },
  garlic:   { len: 11, moq: 7, instant: 2, lead: 5, n23: 9, n4: 5 },
  cinnamon: { len: 11, moq: 6, instant: 2, lead: 5, n23: 9, n4: 4 },
  chili:    { len: 11, moq: 5, instant: 2, lead: 5, n23: 9, n4: 3 },
};
const MOQ_PTS = 2;
const CHECKPOINT_PTS = MOQ_PTS; // older name
const CASHOUT = { 2: [7, 2, 0], 3: [7, 2, 0], 4: [10, 5, 2, 0], 5: [15, 10, 5, 2, 0] };
const SPEC_BONUS = [0, 7, 17, 30];
const BOT_FLIP_THRESHOLD = 57;
const SAFFRON_CUBE_SPACE = 4; // T1, standard in 2-3 player games from v1.21b
const NO_STORE_BASE = new Set(['saffron', 'coin']); // base card of these lots can't be stored

// ---------- Deck (every lot is dealt faceup from v1.21a) ----------
function buildDeck() {
  const d = [];
  const add = (suit, lo, hi, season, doubleN, salted) => {
    for (let n = lo; n <= hi; n++) d.push({ n, suit, icons: n === doubleN ? 2 : 1, salt: salted.includes(n), season, money: 0 });
  };
  add('saffron', 74, 78, 1, null, []);
  add('curry', 66, 73, 1, 73, [70, 71, 72, 73]);
  add('oregano', 57, 65, 1, 65, [63, 64, 65]);
  add('turmeric', 47, 56, 1, 56, [54, 55, 56]);
  add('garlic', 35, 46, 2, 46, [45, 46]);
  add('cinnamon', 20, 34, 2, 34, [33, 34]);
  add('chili', 1, 19, 3, 19, []);
  for (const [n, money, season] of [[79, 2, 2], [80, 2, 2], [81, 5, 1], [82, 5, 1], [83, 7, 1]]) d.push({ n, suit: 'coin', icons: 0, salt: false, season, money });
  return d;
}
const CARDS = Object.fromEntries(buildDeck().map(c => [c.n, c]));
function cardStr(c) {
  if (c.suit === 'coin') return `Coin ${c.n} (+${c.money})`;
  return `${SUIT_NAME[c.suit]} ${c.n}${c.icons === 2 ? ' x2' : ''}${c.salt ? ' (salt)' : ''}`;
}

// ---------- Bids ----------
const bidKey = b => (b ? (b.pair ? 1000 : 0) + b.high : -1);
function bestBid(cards) {
  if (!cards.length) return null;
  const bySuit = {};
  for (const c of cards) (bySuit[c.suit] ??= []).push(c);
  let best = null;
  for (const s in bySuit) {
    const a = bySuit[s].slice().sort((x, y) => y.n - x.n);
    if (a.length >= 2) { const b = { cards: [a[0], a[1]], pair: true, high: a[0].n }; if (!best || bidKey(b) > bidKey(best)) best = b; }
  }
  if (best) return best;
  const top = cards.reduce((m, c) => (c.n > m.n ? c : m));
  return { cards: [top], pair: false, high: top.n };
}
function makeBid(cards) {
  if (cards.length === 2 && cards[0].suit !== cards[1].suit) throw new Error('Pair must be the same suit');
  if (cards.length < 1 || cards.length > 2) throw new Error('Bid 1 or 2 cards');
  return { cards, pair: cards.length === 2, high: Math.max(...cards.map(c => c.n)) };
}
const bidStr = b => (b.pair ? `pair ${cardStr(b.cards[0])} + ${cardStr(b.cards[1])}` : `${cardStr(b.cards[0])}`);

// ---------- Track movement (pure) ----------
function cloneTracks(T) { const o = {}; for (const s in T) o[s] = T[s].map(m => ({ owner: m.owner, pos: m.pos })); return o; }
function stepMarker(tracks, spice, owner, salt) {
  const t = TRACKS[spice], arr = tracks[spice], me = arr.find(m => m.owner === owner);
  const occ = sp => arr.some(m => m.owner !== owner && m.pos === sp);
  const from = me.pos;
  if (from === t.len) return { gain: t.instant, from, to: from, atTop: true, knocked: [], skipped: 0 };
  let next = from + 1;
  if (salt) { if (occ(next)) return { gain: 0, from, to: from, blocked: true, knocked: [], skipped: 0 }; }
  else while (next < t.len && occ(next)) next++;
  const knocked = [];
  if (next === t.len) for (const m of arr) if (m.owner !== owner && m.pos === t.len) { m.pos = t.moq; knocked.push(m.owner); }
  me.pos = next;
  return { gain: next === t.len ? t.instant : 0, from, to: next, skipped: next - from - 1, knocked };
}
function applyCard(tracks, owner, card) {
  const steps = []; let gain = 0;
  for (let k = 0; k < card.icons; k++) { const r = stepMarker(tracks, card.suit, owner, card.salt); gain += r.gain; steps.push(r); }
  return { gain, steps };
}
// Sole leader on a track (players and Deck Bot; neutral cubes never count), or null.
function leaderOf(tracks, spice) {
  const ms = tracks[spice].filter(m => m.owner !== 'n');
  const max = Math.max(...ms.map(m => m.pos));
  const top = ms.filter(m => m.pos === max);
  return top.length === 1 ? top[0].owner : null;
}

// ---------- RNG ----------
function hashSeed(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}
function randomSeed() {
  const w = ['cumin', 'clove', 'anise', 'mace', 'sumac', 'nutmeg', 'fennel', 'cardamom', 'paprika', 'ginger', 'pepper', 'vanilla'];
  const r = () => Math.floor(Math.random() * w.length);
  return `${w[r()]}-${w[r()]}-${Math.floor(Math.random() * 1000)}`;
}
const newStats = () => ({ bids: 0, pairBids: 0, firstPicks: 0, blockedBySalt: 0, knockdownsDealt: 0, timesKnockedDown: 0, leads: 0, moq: 0 });
const newBd = () => ({ top: 0, lead: 0, moq: 0, coin: 0, cashout: 0, spec: 0 });

// ---------- Game ----------
class Game {
  // players: [{ name, agent }]; botRules: { seasonAdvance, scoring }; variants: { saffronCube }
  constructor({ seed, players, replay = null, botRules = {}, variants = {} }) {
    if (players.length < 2 || players.length > 5) throw new Error('2-5 players');
    this.seed = String(seed ?? randomSeed());
    this.rngState = hashSeed(this.seed);
    this.n = players.length;
    this.botRules = { seasonAdvance: 'notLeadingNoSaffron', scoring: true, ...botRules };
    this.variants = { saffronCube: true, ...variants };
    this.players = players.map((p, i) => ({ id: 'p' + i, idx: i, name: p.name || `Player ${i + 1}`, agent: p.agent, hand: [], stored: [], money: 0, bd: newBd(), st: newStats() }));
    this.hasBot = this.n === 2;
    this.bot = this.hasBot ? { id: 'bot', name: 'Deck Bot', money: 0, bd: newBd(), st: newStats() } : null;
    this.deck = []; this.discard = []; this.market = []; this.tracks = {};
    this.season = 0; this.auction = 0; this.phase = 'setup';
    this.log = []; this.decisions = []; this.history = [];
    this.replay = replay ? replay.slice() : null;
    this.reshuffles = 0; this.lotSeq = 0; this.seasonLeaders = [];
    this.hooks = {}; this.moves = []; this.lastBids = null; this.revealing = null;
    this.recordSnapshots = false; // UI turns this on to animate each step
  }
  async pause(kind, data) { if (this.hooks.pause) await this.hooks.pause(kind, data); this.moves = []; }
  rand() {
    let a = (this.rngState = (this.rngState + 0x6d2b79f5) | 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(this.rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  draw() {
    if (!this.deck.length) {
      if (!this.discard.length) return null;
      this.deck = this.shuffle(this.discard); this.discard = []; this.reshuffles++;
      this.say(`Deck ran out — discards shuffled into a new deck (${this.deck.length} cards).`);
    }
    return this.deck.pop();
  }
  tag() { return this.season ? `S${this.season}${this.auction && (this.phase === 'auction' || this.phase === 'buying') ? ' A' + this.auction : ''}` : 'Setup'; }
  say(msg) {
    if (this.players.some(p => p.name === 'You')) {
      msg = msg.replace(/\bYou (buys|stores|cashes|seeds|reveals|chooses|leads|knocks)\b/g, (m, v) => 'You ' + ({ buys: 'buy', stores: 'store', cashes: 'cash', seeds: 'seed', reveals: 'reveal', chooses: 'choose', leads: 'lead', knocks: 'knock' })[v])
        .replace(/knocks You down/g, 'knocks you down');
    }
    this.log.push(`[${this.tag()}] ${msg}`);
  }
  nameOf(owner) { if (owner === 'bot') return this.bot.name; if (owner === 'n') return 'Neutral'; return this.players[+owner.slice(1)].name; }
  owners() { return [...this.players.map(p => p.id), ...(this.hasBot ? ['bot'] : [])]; }
  who(owner) { return owner === 'bot' ? this.bot : this.players[+owner.slice(1)]; }
  credit(owner, amt, cat) {
    if (!amt) return;
    if (owner === 'bot' && !this.botRules.scoring) return;
    const w = this.who(owner); w.money += amt; w.bd[cat] += amt;
  }
  pos(owner, spice) { return this.tracks[spice].find(m => m.owner === owner).pos; }
  remainingScorings() { return Math.max(0, 4 - this.season); }
  cardCount() {
    let k = this.deck.length + this.discard.length;
    for (const l of this.market) k += l.cards.length;
    for (const p of this.players) k += p.hand.length + p.stored.length;
    return k;
  }
  async decide(i, req) {
    let choice;
    if (this.replay) {
      const d = this.replay.shift();
      if (!d || d.type !== req.type || d.player !== i) throw new Error(`Replay mismatch at ${this.tag()} (${req.type}, player ${i})`);
      choice = d.choice;
    } else choice = await this.players[i].agent.decide(this, i, req);
    this.decisions.push({ s: this.season, a: this.auction, type: req.type, player: i, choice });
    return choice;
  }
  // Several players at once. Bids may go through hooks.collectBids (undo support); recorded in seat order.
  async decideAll(list) {
    if (this.replay || (!this.parallel && !(['bid', 'seed'].includes(list[0]?.[1].type) && this.hooks.collectBids))) {
      const out = []; for (const [i, r] of list) out.push(await this.decide(i, r)); return out;
    }
    const choices = ['bid', 'seed'].includes(list[0][1].type) && this.hooks.collectBids
      ? await this.hooks.collectBids(list)
      : await Promise.all(list.map(([i, req]) => Promise.resolve(this.players[i].agent.decide(this, i, req))));
    list.forEach(([i, req], k) => this.decisions.push({ s: this.season, a: this.auction, type: req.type, player: i, choice: choices[k] }));
    return choices;
  }
  snapshot(label) {
    const pos = {};
    for (const s of SPICES) pos[s] = Object.fromEntries(this.tracks[s].filter(m => m.owner !== 'n').map(m => [m.owner, m.pos]));
    this.history.push({ label, money: this.players.map(p => p.money), botMoney: this.bot ? this.bot.money : null,
      bd: this.players.map(p => ({ ...p.bd })), botBd: this.bot ? { ...this.bot.bd } : null, pos });
  }
  // A lot is its base card plus extra cards; extras can be dealt later (G1).
  makeLot(card, withExtras = true) {
    const lot = { id: 'L' + (++this.lotSeq), cards: [{ c: card, fd: false }], pending: !withExtras };
    if (withExtras) this.dealExtras(lot);
    return lot;
  }
  dealExtras(lot) {
    for (let k = 0; k < lot.cards[0].c.season; k++) { const d = this.draw(); if (d) lot.cards.push({ c: d, fd: false }); }
    lot.pending = false;
  }
  lotStr(lot) { return lot.cards.map(x => cardStr(x.c)).join(', ') + (lot.pending ? ' (extra cards dealt after storage)' : ''); }
  logMarket() { this.say(`Market: ${this.market.map((l, k) => `Lot ${k + 1}: ${this.lotStr(l)}`).join(' | ')}`); }
  take(arr, n) { const k = arr.findIndex(c => c.n === n); if (k < 0) throw new Error(`Card ${n} not available`); return arr.splice(k, 1)[0]; }

  // One marker step, recorded for the log, statistics and animation.
  moveStep(owner, spice, salt) {
    const before = this.recordSnapshots ? cloneTracks(this.tracks) : null;
    const leadBefore = leaderOf(this.tracks, spice);
    const r = stepMarker(this.tracks, spice, owner, salt);
    const leadAfter = leaderOf(this.tracks, spice);
    const mv = { owner, spice, from: r.from, to: r.to, blocked: !!r.blocked, atTop: !!r.atTop, knocked: r.knocked, skipped: r.skipped || 0, gain: r.gain,
      reachedMoq: r.from < TRACKS[spice].moq && r.to >= TRACKS[spice].moq, reachedTop: !r.atTop && r.to === TRACKS[spice].len, tookLead: leadAfter === owner && leadBefore !== owner };
    if (this.recordSnapshots) { mv.before = before; mv.after = cloneTracks(this.tracks); }
    this.moves.push(mv);
    const w = owner === 'n' ? null : this.who(owner);
    if (w) {
      if (r.blocked) w.st.blockedBySalt++;
      for (const k of r.knocked) { w.st.knockdownsDealt++; if (k !== 'n') this.who(k).st.timesKnockedDown++; }
    }
    this.credit(owner, r.gain, 'top');
    return r;
  }
  moveWith(owner, cards, why) {
    for (const c of cards) {
      if (!c.icons) continue;
      const parts = [], moments = [];
      for (let k = 0; k < c.icons; k++) {
        const s = this.moveStep(owner, c.suit, c.salt);
        moments.push(this.moves[this.moves.length - 1]);
        if (s.blocked) parts.push(`salt blocked at ${s.from}`);
        else if (s.atTop) parts.push(`at top, sells surplus +${s.gain}`);
        else {
          parts.push(`${s.from}→${s.to}${s.skipped ? ` (skipped ${s.skipped})` : ''}${s.gain ? ` reaches top +${s.gain}` : ''}`);
          for (const kk of s.knocked) parts.push(`knocks ${this.nameOf(kk)} down to MOQ`);
        }
      }
      this.say(`  ${this.nameOf(owner)} ${why} ${cardStr(c)} on ${SUIT_NAME[c.suit]}: ${parts.join('; ')}`);
      for (const m of moments) this.sayMoments(m);
    }
  }
  // Major moments get their own log lines (U16).
  momentText(m) {
    const who = this.nameOf(m.owner), sp = SUIT_NAME[m.spice], out = [];
    if (m.blocked) out.push(`${who} is blocked by salt on ${sp}`);
    if (m.skipped) out.push(`${who} skips ${m.skipped} space${m.skipped > 1 ? 's' : ''} on ${sp}`);
    if (m.reachedMoq) out.push(`${who} reaches the MOQ on ${sp}`);
    if (m.reachedTop) out.push(`${who} reaches the top of ${sp} (+${m.gain})`);
    for (const k of m.knocked || []) out.push(`${who} knocks ${k === 'n' ? 'a neutral cube' : this.nameOf(k)} down to the MOQ on ${sp}`);
    if (m.tookLead) out.push(`${who} takes the lead on ${sp}`);
    return out;
  }
  sayMoments(m) { for (const t of this.momentText(m)) this.say(`  » ${t}.`); }
  deckBotBid() {
    const flips = [this.draw()];
    const extra = flips[0].n >= BOT_FLIP_THRESHOLD ? 1 : 2;
    for (let k = 0; k < extra; k++) { const d = this.draw(); if (d) flips.push(d); }
    return { flips, bid: bestBid(flips) };
  }

  // ---------- Phases ----------
  async setup() {
    this.deck = this.shuffle(buildDeck());
    for (const s of SPICES) {
      const t = TRACKS[s];
      const arr = this.players.map(p => ({ owner: p.id, pos: 1 }));
      if (this.hasBot) arr.push({ owner: 'bot', pos: 1 });
      if (this.n <= 4 && t.n4) arr.push({ owner: 'n', pos: t.n4 });
      if (this.n <= 3 && t.n23) arr.push({ owner: 'n', pos: t.n23 });
      if (this.n <= 3 && s === 'saffron' && this.variants.saffronCube) arr.push({ owner: 'n', pos: SAFFRON_CUBE_SPACE });
      this.tracks[s] = arr;
    }
    this.say(`New game. Seed "${this.seed}". Rules v${RULES_VERSION}, engine ${ENGINE_VERSION}. Players: ${this.players.map(p => p.name).join(', ')}${this.hasBot ? ` + Deck Bot${this.botRules.scoring ? '' : ' (not scoring)'}` : ''}.`);
    if (this.n <= 4) this.say(`Neutral cubes placed on the "4" space${this.n <= 3 ? ' and the "2/3" space' : ''} of every track except Saffron (no "4" cube on Curry).`);
    if (this.n <= 3 && this.variants.saffronCube) this.say(`Neutral cube placed on Saffron space ${SAFFRON_CUBE_SPACE}.`);
    if (this.n <= 3 && !this.variants.saffronCube) this.say('Variant: no Saffron cube.');
    for (let k = 0; k < 7; k++) for (const p of this.players) p.hand.push(this.draw());
    const seedChoices = await this.decideAll(this.players.map(p => [p.idx, { type: 'seed' }]));
    const seeds = [];
    this.players.forEach((p, k) => { const c = this.take(p.hand, seedChoices[k]); seeds.push(c); this.say(`${p.name} seeds the market with ${cardStr(c)}.`); });
    if (this.hasBot) { const c = this.draw(); seeds.push(c); this.say(`Deck Bot seeds the market with ${cardStr(c)}.`); }
    this.market = seeds.map(c => this.makeLot(c));
    this.logMarket();
    this.snapshot('Setup');
    await this.pause('market');
  }

  async runAuction() {
    this.phase = 'auction';
    this.auction++;
    const bidChoices = await this.decideAll(this.players.map(p => [p.idx, { type: 'bid' }]));
    const bids = [];
    for (const p of this.players) {

// ---------- downloads ----------
let dlPromise = null;
async function saveFile(filename, text) {
  try {
    if (!dlPromise) dlPromise = window.claude?.use ? window.claude.use('downloads') : Promise.resolve(null);
    const dl = await dlPromise;
    if (dl) { await dl.save({ filename, data: text }); return; }
  } catch (e) { if (e && e.code === 'declined') return; }
  if (!window.claude) {
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: filename.endsWith('.json') ? 'application/json' : 'text/plain' }));
      a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      return;
    } catch { }
  }
  ui.modal = { type: 'text', title: filename, text };
  render();
}

  }

// ---------- helpers ----------
function colorOf(owner) { if (owner === 'bot') return BOTCOLOR; if (owner === 'n') return '#9a958c'; return PCOLORS[+owner.slice(1)]; }
function dotHTML(owner) { return `<span class="dot" style="background:${colorOf(owner)}"></span>`; }
function initial(g, owner) { return owner === 'bot' ? 'B' : g.nameOf(owner).slice(0, 1).toUpperCase(); }
function perms(a) { if (a.length <= 1) return [a]; const o = []; a.forEach((x, i) => { for (const r of perms([...a.slice(0, i), ...a.slice(i + 1)])) o.push([x, ...r]); }); return o; }
function stepText(s) { return s.blocked ? 'blocked by salt' : s.atTop ? `at the top, +${s.gain}` : `${s.from}→${s.to}${s.skipped ? ` (skips ${s.skipped})` : ''}${s.gain ? `, +${s.gain}` : ''}${s.knocked.length ? ', knocks a marker down' : ''}`; }
// Distinct outcomes of applying cards in each order, with a Pareto recommendation (U1).
function orderGroups(g, owner, ns) {
  const groups = new Map();
  for (const p of perms(ns)) {
    const tr = cloneTracks(g.tracks);
    let gain = 0; const desc = [];
    for (const n of p) { const c = CARDS[n]; const r = applyCard(tr, owner, c); gain += r.gain; desc.push({ n, text: r.steps.map(stepText).join(', ') }); }
    const key = JSON.stringify(SPICES.map(s => tr[s].map(m => m.pos))) + '|' + gain;
    if (!groups.has(key)) groups.set(key, { order: p, desc, gain, pos: Object.fromEntries(SPICES.map(s => [s, tr[s].find(m => m.owner === owner).pos])), tracks: tr });
  }
  const list = [...groups.values()];
  const dominates = (a, b) => {
    let better = false;
    for (const s of SPICES) { if (a.pos[s] < b.pos[s]) return false; if (a.pos[s] > b.pos[s]) better = true; }
    return better || a.gain > b.gain;
  };
  for (const a of list) {
    if (list.length > 1 && list.every(b => b === a || dominates(a, b))) {
      a.recommended = true;
      const higher = SPICES.filter(s => list.some(b => b !== a && a.pos[s] > b.pos[s])).map(s => SUIT_NAME[s]);
      a.why = higher.length ? `you end up higher on ${higher.join(' and ')} and lose nothing elsewhere` : 'same positions, more points';
    }
  }
  return list;
}
function bestGroup(groups) { return groups.find(x => x.recommended) || groups.slice().sort((a, b) => (SPICES.reduce((s, k) => s + b.pos[k], 0) + b.gain) - (SPICES.reduce((s, k) => s + a.pos[k], 0) + a.gain))[0]; }
function needCards(g) { return 3 - g.auction; }
function bidLabel(cards) {
  if (!cards.length) return '';
  if (cards.length === 2) return cards[0].suit !== cards[1].suit ? 'A pair must be two cards of the same spice.' : `Pair of ${SUIT_NAME[cards[0].suit]}, high card ${Math.max(cards[0].n, cards[1].n)}`;
  return `Single card ${cards[0].n}`;
}
function potentialSpec(g, owner) { const u = SPICES.filter(s => g.tracks[s].find(m => m.owner === owner).pos === 1).length; return SPEC_BONUS[Math.min(3, u)]; }
function netInfo(g) {
  const o = ui.online, out = { remote: new Set(), online: new Set(), waiting: new Set() };
  if (!o.role || !o.lobby) return out;
  o.lobby.seats.forEach((s, i) => { if (s.kind === 'online' || (o.role === 'guest' && s.kind === 'host')) out.remote.add(i); });
  if (o.role === 'host') { o.online.forEach(i => out.online.add(i)); o.pending?.forEach((_, i) => out.waiting.add(i)); if (ui.pending) out.waiting.add(ui.pending.i); }
  else { (g.online || []).forEach(i => out.online.add(i)); if (o.hostHere !== false) out.online.add(0); (g.waiting || []).forEach(i => out.waiting.add(i)); }
  return out;
}
function humanIdxs(g) { return g.players.filter(p => p.agent === HumanAgent).map(p => p.idx); }
function phaseLabel(g) {
  if (g.phase === 'setup') return { big: 'Setting up', step: 'Seed the market' };
  if (g.phase === 'over' || g.phase === 'final' || g.season > 3) return { big: 'Final scoring', step: 'Cash-out and specialization' };
  if (g.phase === 'seasonEnd') return { big: `Season ${g.season}: end of season`, step: 'Storage: hands are revealed and move markers' };
  if (g.phase === 'scoring') return { big: `Season ${g.season}: end of season`, step: 'Scoring: leads and MOQ' };
  const a = Math.max(1, g.auction);
  return { big: `Season ${g.season}: auction ${a} of 3`, step: g.phase === 'buying' ? 'Buying lots in bid order' : 'Bidding' };
}

// ---------- agents ----------
const HumanAgent = {
  decide(g, i, req) {
    return new Promise(async resolve => {
      const gen = ui.gen;
      if (req.type === 'order' || req.type === 'endOrder') {
        const groups = orderGroups(g, g.players[i].id, req.cards);
        if (groups.length === 1) { resolve(req.cards); return; }
        req = { ...req, groups };
      }
      await handoff(g, i);
      if (gen !== ui.gen) return;
      ui.pending = { i, req, resolve: v => { ui.pending = null; ui.sel = []; if (ui.humans.length > 1 && !ui.bidRound) ui.viewer = null; render(); resolve(v); if (ui.online.role === 'host') publishState(); } };
      ui.sel = [];
      render();
      if (ui.online.role === 'host') publishState();
      await coachFor('intro');
      await coachFor(req.type);
    });
  },
};
async function handoff(g, i) {
  if (ui.humans.length <= 1) { ui.viewer = i; return; }
  if (ui.viewer === i) return;
  ui.viewer = null;
  await new Promise(res => { ui.modal = { type: 'handoff', name: g.players[i].name, res }; render(); });
  ui.viewer = i;
}

// ---------- bids with undo (G2/U5) ----------
// Undo applies when more than one human bids (online or pass-and-play). With one human, bids lock at once.
async function collectBids(list) {
  const g = ui.game;
  const kinds = list.map(([i]) => g.players[i].agent === HumanAgent ? 'local' : g.players[i].agent === RemoteAgent ? 'remote' : 'bot');
  const humansBidding = kinds.filter(k => k !== 'bot').length;
  if (humansBidding <= 1) return Promise.all(list.map(([i, req]) => Promise.resolve(g.players[i].agent.decide(g, i, req))));
  const choices = new Array(list.length).fill(null);
  list.forEach(([i, req], k) => { if (kinds[k] === 'bot') choices[k] = BotAgent.decide(g, i, req); });
  const hotseat = !ui.online.role;
  return new Promise(resolveAll => {
    const rtype = list[0][1].type;
    const round = ui.bidRound = { choices, kinds, list, hotseat, finish: null, type: rtype };
    const ready = () => choices.every(c => c !== null);
    const done = () => { ui.bidRound = null; ui.myBid = null; ui.modal = null; render(); resolveAll(choices.slice()); };
    const check = () => {
      if (!ready()) return;
      if (hotseat) { ui.modal = { type: 'bidsIn' }; render(); }
      else done();
    };
    round.ask = async k => {
      const [i] = list[k];
      if (kinds[k] === 'local') {
        const v = await HumanAgent.decide(g, i, { type: rtype });
        if (ui.bidRound !== round) return;
        choices[k] = v;
        if (!hotseat) ui.myBid = { i, cards: rtype === 'seed' ? [v] : v, type: rtype };
        render(); if (ui.online.role === 'host') publishState();
        if (hotseat) { const next = choices.findIndex((c, kk) => c === null && kinds[kk] === 'local'); if (next >= 0) { round.ask(next); return; } }
        check();
      } else if (kinds[k] === 'remote') {
        const v = await RemoteAgent.decide(g, i, { type: rtype });
        if (ui.bidRound !== round) return;
        choices[k] = v; render(); publishState(); check();
      }
    };
    round.undo = k => { if (choices[k] === null) return; choices[k] = null; if (kinds[k] === 'local' && !hotseat) ui.myBid = null; ui.modal = null; round.ask(k); };
    round.reveal = done;
    if (hotseat) { const first = kinds.findIndex(k => k === 'local'); round.ask(first); }
    else kinds.forEach((kd, k) => { if (kd !== 'bot') round.ask(k); });
    render();
  });
}

// ---------- walkthrough ----------
const TIPS = {
  intro: ['Welcome to Saffron Salt', 'You are a spice trader. Over three seasons you bid on lots of spice cards, climb the seven spice tracks, and earn points. The player with the most points at the end wins. This walkthrough explains each step the first time it happens.'],
  seed: ['Seed the market', 'Each player starts by placing one card from their hand into the market. Every card in the market grows into a lot: it gets extra cards from the deck, shown by the +1, +2 or +3 badge.'],
  market: ['The market', 'These are the lots up for auction. Each lot is one base card plus its extra cards. When you buy a lot, you climb the track of every spice in it, cash any coin cards, and keep one card. A Saffron or coin base card lies sideways: it can’t be kept.'],
  bid: ['Place a bid', 'Bid one card, or two cards of the same spice. Any pair beats any single card; otherwise the higher card number wins. Bid cards leave your hand, so think about what you keep: leftover cards also move you at the end of the season.'],
  reveal: ['Bids are revealed', 'Players buy lots in bid order, highest first. After buying, each bid becomes a new market card: the higher card of a pair goes to the market and the lower one is discarded.'],
  lot: ['Choose a lot', 'Select a lot to preview where your markers would end up, then confirm. Each spice card moves your marker one space up its track, or two for cards with a double icon. Coin cards are worth points right away.'],
  move: ['Climbing tracks', 'Markers skip over spaces that are already occupied, so a crowded track can carry you further. The grey squares are neutral cubes: they never move, but they take up space.'],
  salt: ['Salt', 'Cards with a salt shaker cannot skip. If the space directly above you is occupied, that movement is lost.'],
  top: ['Reaching the top', 'The top space pays points every time you reach it, and again for every extra movement while you are there. If someone else is already at the top, you knock them down to the MOQ space.'],
  store: ['Store a card', 'Keep one card from each lot you buy, except a Saffron or coin base card. Stored cards return to your hand next season. In the last season, your three stored cards make your final cash-out bid instead.'],
  storage: ['End of season', 'Everyone reveals the cards left in their hand. Each one moves you up its track, just like buying it. Then the hand is discarded. The next season’s lots get their extra cards only after this.'],
  scoring: ['Season scoring', 'On each track, the player furthest ahead scores the lead bonus shown on the tab (7 for Saffron, 5 elsewhere). Everyone else at or above the MOQ (Minimum Order Quantity) space scores 2. A tie for the lead means nobody leads.'],
  seasonStart: ['A new season', 'Your stored cards come back into your hand, and you are dealt three more. The market carries over from the last auction.'],
  final: ['Final scoring', 'Your three stored cards make one last bid: the best bids earn cash-out points. Then players earn a bonus for tracks they never moved on: 7 for one, 17 for two, 30 for three or more.'],
};
async function coachFor(kind) {
  if (!ui.tutorial || ui.coachSeen.has(kind) || !TIPS[kind]) return;
  ui.coachSeen.add(kind);
  await new Promise(res => { ui.coach = { kind, res }; render(); });
}

// ---------- timing and animation (U2, U3, U6, U12, U13) ----------
function speedMul() { return window.__fast ? 0 : ({ slow: 1.8, normal: 1, fast: .35, instant: 0 }[ui.setup.speed]); }
function speedMs(kind) { return ({ market: 700, reveal: 1500, buy: 900, storage: 900, botStorage: 700, scoring: 600, seasonStart: 500, final: 300 }[kind] ?? 600) * speedMul(); }
function moveFx(mv) {
  const fx = [];
  for (const k of mv.knocked || []) fx.push({ cls: 'fx-knock', text: k === 'n' ? 'Knocks a cube down' : 'Knockdown!' });
  if (mv.reachedTop) fx.push({ cls: 'fx-top', text: `Top! +${mv.gain}` });
  else if (mv.atTop) fx.push({ cls: 'fx-top', text: `+${mv.gain}` });
  if (mv.tookLead) fx.push({ cls: 'fx-lead', text: 'Takes the lead' });
  if (mv.reachedMoq) fx.push({ cls: 'fx-moq', text: 'Reaches MOQ' });
  if (mv.skipped) fx.push({ cls: 'fx-skip', text: `Skips ${mv.skipped}` });
  if (mv.blocked) fx.push({ cls: 'fx-salt', text: 'Salt blocks' });
  return fx;
}
async function animateMoves(gen) {
  const mul = speedMul();
  const moves = ui.moves.filter(m => m.before && m.after);
  if (!mul || !moves.length) return;
  for (const mv of moves) {
    if (gen !== ui.gen) return;
    const fx = moveFx(mv);
    ui.anim = { tracks: mv.before, mv, stage: 'from' }; render();
    await sleep(160 * mul);
    ui.anim = { tracks: mv.after, mv, stage: 'to', fx }; render();
    await sleep((fx.some(f => f.cls === 'fx-knock' || f.cls === 'fx-top' || f.cls === 'fx-lead') ? 1100 : fx.length ? 750 : 420) * mul);
  }
  ui.anim = null;
}
function showToast(text) { ui.toast = { text, at: Date.now() }; }
function seasonSummaryOf(g) {
  const H = g.history, end = H[H.length - 1];
  const prev = [...H].reverse().find(h => h !== end && (/end$/.test(h.label) || h.label === 'Setup'));
  const rows = g.players.map((p, i) => ({ owner: p.id, name: p.name, total: end.money[i], gained: end.money[i] - (prev ? prev.money[i] : 0),
    by: Object.fromEntries(CAT.map(([k]) => [k, (end.bd[i][k] || 0) - (prev ? prev.bd[i][k] || 0 : 0)])) }));
  if (g.hasBot && g.botRules.scoring) rows.push({ owner: 'bot', name: 'Deck Bot', total: end.botMoney, gained: end.botMoney - (prev ? prev.botMoney : 0),
    by: Object.fromEntries(CAT.map(([k]) => [k, (end.botBd[k] || 0) - (prev ? prev.botBd[k] || 0 : 0)])) });
  return { season: g.season, rows };
}

// ---------- game lifecycle ----------
async function startGame({ seed, seats, botRule, botScoring = true, tutorial = false, replay = null, online = false }) {
  const gen = ++ui.gen;
  Object.assign(ui, { tutorial, coachSeen: new Set(), coach: null, modal: null, paused: false, result: null, pending: null, anim: null, toast: null, scoreFx: null, seasonSummary: null, bidRound: null, myBid: null, viewOnly: null, lastMoves: [] });
  ui.lastSettings = { seats: seats.map(s => ({ ...s })), botRule, botScoring };
  const players = seats.map(s => ({ name: s.name, agent: s.human ? HumanAgent : s.remote ? RemoteAgent : BotAgent }));
  const g = new Game({ seed, players, replay: replay?.decisions || null, botRules: { seasonAdvance: botRule, scoring: botScoring } });
  g.recordSnapshots = true;
  if (online) { g.parallel = true; ui.online.pending = new Map(); ui.online.botSeats = new Set(); }
  else if (ui.online.role) leaveOnline();
  if (!replay) g.hooks.collectBids = collectBids;
  ui.game = g; ui.humans = replay ? [] : humanIdxs(g); ui.watch = !ui.humans.length; ui.replayOf = replay;
  ui.viewer = ui.humans.length === 1 ? ui.humans[0] : null;
  ui.peek = ui.watch ? 'all' : 'none';
  ui.view = 'table';
  g.hooks.pause = async (kind, data) => {
    if (gen !== ui.gen) throw new Error('aborted');
    ui.moves = g.moves.slice();
    if (kind === 'reveal') showToast('Bids revealed: buying in bid order');
    if (kind === 'market' && data?.auctionDone) showToast(`Auction ${data.auctionDone} complete`);
    if (kind === 'seasonStart') { showToast(`Season ${g.season} begins`); ui.seasonSummary = null; }
    if ((kind === 'botStorage' || kind === 'storage') && ui.storageToast !== g.season) { ui.storageToast = g.season; showToast(`End of season ${g.season}: storage`); }
    if (kind === 'scoreTrack') { ui.scoreFx = data; render(); if (online) publishState(); await sleep(650 * speedMul()); ui.scoreFx = null; return; }
    if (ui.moves.length) { ui.mvKey = (ui.mvKey || 0) + 1; if (online) publishState(); await animateMoves(gen); ui.lastMoves = ui.moves.slice(); ui.movedAt = Date.now(); }
    if (kind === 'scoring') ui.seasonSummary = seasonSummaryOf(g);
    render();
    if (online) publishState();
    if (ui.tutorial) {
      if (kind === 'buy') {
        if (ui.moves.length) await coachFor('move');
        if (data?.owner && ui.humans.includes(+data.owner.slice(1))) await coachFor('store');
        if (ui.moves.some(m => m.blocked)) await coachFor('salt');
        if (ui.moves.some(m => m.reachedTop)) await coachFor('top');
      } else if (kind === 'seasonStart') { if (g.season > 1) await coachFor('seasonStart'); }
      else await coachFor(kind);
    }
    if (kind === 'scoring' && ui.humans.length && !ui.watch) {
      await new Promise(res => { ui.modal = { type: 'season', res }; render(); });
    } else { const ms = speedMs(kind); if (ms) await sleep(kind === 'scoring' ? ms * 4 : ms); }
    while (ui.paused && gen === ui.gen) await sleep(150);
    if (gen !== ui.gen) throw new Error('aborted');
  };
  render();
  window.scrollTo(0, 0);
  try {
    const r = await g.run();
    if (gen !== ui.gen) return;
    ui.result = r; ui.view = 'results'; ui.moves = []; ui.anim = null; ui.lastMoves = [];
    if (!tutorial && !replay) recordGame(r, g, online ? 'online' : ui.watch ? 'watch' : 'local');
    render();
    if (online) publishState();
    window.scrollTo(0, 0);
  } catch (e) {
    if (e.message !== 'aborted') { console.error(e); ui.modal = { type: 'text', title: 'Something went wrong', text: String(e.stack || e) }; render(); }
  }
}
function quitToHome() { if (ui.online.role) leaveOnline(); ui.gen++; Object.assign(ui, { view: 'home', game: null, pending: null, coach: null, modal: null, bidRound: null, anim: null, viewOnly: null }); render(); }
function replayJSON(r, g) {
  return JSON.stringify({ format: 'saffron-salt-replay', rulesVersion: RULES_VERSION, engineVersion: ENGINE_VERSION, seed: r.seed, botRule: g.botRules.seasonAdvance, botScoring: g.botRules.scoring,
    players: g.players.map(p => ({ name: p.name, human: p.agent === HumanAgent || p.agent === RemoteAgent })), decisions: r.decisions }, null, 1);
}

// Ghost positions for the selected lot (U7).
function previewFor(g) {
  const p = ui.pending;
  if (!p || (p.req.type !== 'lot' && p.req.type !== 'botLot') || !ui.sel.length) return null;
  const lot = g.market.find(l => l.id === ui.sel[0]);
  if (!lot) return null;
  const owner = p.req.type === 'lot' ? g.players[p.i].id : 'bot';
  const cards = lot.cards.filter(x => !x.fd && x.c.icons).map(x => x.c);
  const money = lot.cards.filter(x => !x.fd).reduce((s, x) => s + x.c.money, 0);
  if (!cards.length) return { owner, tracks: g.tracks, desc: [], gain: 0, money, multi: false };
  const groups = orderGroups(g, owner, cards.map(c => c.n));
  const best = bestGroup(groups);
  return { owner, tracks: best.tracks, desc: best.desc, gain: best.gain, money, multi: groups.length > 1 };
}
function trackHTML(g, s) {
  const t = TRACKS[s];
  const anim = ui.anim;
  const tracks = anim ? anim.tracks : g.tracks;
  const marks = {};
  for (const m of tracks[s]) (marks[m.pos] ??= []).push(m.owner);
  const pv = previewFor(g);
  const ghost = pv ? pv.tracks[s].find(m => m.owner === pv.owner).pos : null;
  const cur = g.tracks[s].find(m => m.owner === (pv && pv.owner)) ?.pos;
  const fade = Date.now() - ui.movedAt;
  const recent = !anim && fade < 2600 ? ui.lastMoves.filter(m => m.spice === s) : [];
  const am = anim && anim.mv.spice === s ? anim.mv : null;
  const sf = ui.scoreFx && ui.scoreFx.spice === s ? ui.scoreFx : null;
  let rows = '';
  for (let pos = t.len; pos >= 1; pos--) {
    const cls = ['sp'];
    if (pos === t.len) cls.push('top');
    if (pos === t.moq) cls.push('moq');
    if (pos === 1) cls.push('start');
    let ghostEl = '';
    if (pos === t.len) ghostEl = `<span class="ghost"><span class="coin ${s === 'saffron' ? 'gold' : ''}">${t.instant}</span></span>`;
    else if (pos === t.moq) ghostEl = `<span class="ghost" style="opacity:.5"><span class="coin">2</span></span>`;
    else if (pos !== 1) ghostEl = `<span class="ghost">${ic(s)}</span>`;
    const lbl = pos === t.moq ? `<span class="lbl" title="${MOQ_TIP}">MOQ</span>` : pos === 1 ? '<span class="lbl">Start</span>' : '';
    const mk = (marks[pos] || []).map(o => {
      if (o === 'n') return `<span class="mk neutral" title="Neutral cube" aria-label="Neutral cube"></span>`;
      const extra = [];
      if (am && am.owner === o && pos === (anim.stage === 'from' ? am.from : am.to)) extra.push('moving', anim.stage === 'to' ? (am.skipped ? 'mv-skip' : am.blocked ? 'mv-salt' : 'mv-step') : '');
      if (am && anim.stage === 'to' && am.knocked.includes(o) && pos === t.moq) extra.push('knocked');
      if (recent.some(m => m.owner === o && m.to === pos)) extra.push('moved');
      if (sf && sf.awards.some(a => a.owner === o)) extra.push('scored');
      const style = `background:${colorOf(o)};--pc:${colorOf(o)}${extra.includes('moved') ? `;animation-delay:-${fade}ms` : ''}`;
      return `<span class="mk ${extra.join(' ')}" style="${style}" title="${esc(g.nameOf(o))}" aria-label="${esc(g.nameOf(o))}">${initial(g, o)}</span>`;
    }).join('');
    const gh = pv && ghost !== cur && pos === ghost ? `<span class="mk preview" style="border-color:${colorOf(pv.owner)};color:${colorOf(pv.owner)}" title="Where this lot would take ${esc(g.nameOf(pv.owner))}">${initial(g, pv.owner)}</span>` : '';
    let fxEl = '';
    if (am && anim.stage === 'to' && pos === am.to && anim.fx?.length) fxEl = `<span class="fx ${anim.fx[0].cls}">${esc(anim.fx.map(f => f.text).join(' · '))}</span>`;
    if (sf) {
      const here = sf.awards.filter(a => (marks[pos] || []).includes(a.owner));
      if (here.length) fxEl = here.map((a, j) => `<span class="fx fx-score" style="background:${colorOf(a.owner)};bottom:calc(100% + ${4 + j * 30}px)">${esc(`${g.nameOf(a.owner)} +${a.pts} ${a.kind === 'lead' ? 'lead' : 'MOQ'}`)}</span>`).join('');
    }
    rows += `<div class="${cls.join(' ')}" aria-label="${SUIT_NAME[s]} space ${pos}">${ghostEl}${lbl}${mk}${gh}${fxEl}</div>`;
  }
  const leader = leaderOf(tracks, s);
  return `<div class="track s-${s} ${sf ? 'scoring' : ''} ${am ? 'active' : ''}"><div class="thead"><span class="lead" title="Lead bonus at season end">${t.lead}</span><div class="tn">${ic(s)} ${SUIT_NAME[s]}</div><div class="tlead">${leader ? `Lead: ${esc(g.nameOf(leader))}` : 'No leader'}</div></div>${rows}</div>`;
}

function handHTML(g, viewer) {

function seasonScoresTable(r, nameOf, botScores) {
  const ends = ['S1 end', 'S2 end', 'S3 end', 'Final'].map(l => r.history.find(h => h.label === l)).filter(Boolean);
  const rows = r.players.map((p, i) => ({ owner: 'p' + i, name: p.name, vals: ends.map(h => h.money[i]) }));
  if (r.bot && botScores) rows.push({ owner: 'bot', name: 'Deck Bot', vals: ends.map(h => h.botMoney) });
  const heads = ['Season 1', 'Season 2', 'Season 3', 'Final'].slice(0, ends.length);
  return `<div class="scroll"><table class="st"><thead><tr><th></th>${heads.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr><td>${dotHTML(row.owner)} ${esc(row.name)}</td>${row.vals.map((v, k) => `<td><strong>${v}</strong> <span class="muted">(+${v - (k ? row.vals[k - 1] : 0)})</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function breakdownSVG(r, botScores) {
  const rows = r.players.map(p => ({ name: p.name, bd: p.breakdown, total: p.score }));
  if (r.bot && botScores) rows.push({ name: 'Deck Bot', bd: r.bot.breakdown, total: r.bot.score });
  const max = Math.max(...rows.map(x => x.total), 1);
  const W = 460, rh = 30, lw = 90;
  let y = 6, out = '';
  for (const row of rows) {
    let x = lw;
    out += `<text x="0" y="${y + 18}" fill="currentColor" font-size="13">${esc(row.name)}</text>`;
    for (const [k, , c] of CAT) { const v = row.bd[k] || 0; if (!v) continue; const w = (v / max) * (W - lw - 40); out += `<rect x="${x}" y="${y + 4}" width="${w}" height="${rh - 10}" fill="${c}"><title>${v}</title></rect>`; x += w; }
    out += `<text x="${x + 6}" y="${y + 18}" fill="currentColor" font-size="13">${row.total}</text>`;
    y += rh;
  }
  return `<svg viewBox="0 0 ${W} ${y + 6}" width="100%" role="img" aria-label="Points by source per player">${out}</svg>`;
}
function lineSVG(r, botScores) {
  const H = r.history, W = 460, Ht = 200, pad = 30;
  const series = r.players.map((p, i) => ({ name: p.name, c: PCOLORS[i], v: H.map(h => h.money[i]) }));
  if (r.bot && botScores) series.push({ name: 'Deck Bot', c: BOTCOLOR, v: H.map(h => h.botMoney) });
  const max = Math.max(1, ...series.flatMap(s => s.v));
  const x = k => pad + (k / (H.length - 1)) * (W - pad - 10), y = v => Ht - pad - (v / max) * (Ht - pad - 10);
  let out = `<line x1="${pad}" y1="${Ht - pad}" x2="${W - 10}" y2="${Ht - pad}" stroke="currentColor" opacity=".3"/>`;
  H.forEach((h, k) => { if (/end$/.test(h.label)) out += `<line x1="${x(k)}" y1="10" x2="${x(k)}" y2="${Ht - pad}" stroke="currentColor" opacity=".15"/><text x="${x(k)}" y="${Ht - 12}" font-size="11" text-anchor="middle" fill="currentColor">${h.label.replace(' end', '')}</text>`; });
  for (const t of [0, Math.round(max / 2), max]) out += `<text x="${pad - 6}" y="${y(t) + 4}" font-size="11" text-anchor="end" fill="currentColor">${t}</text>`;
  for (const s of series) out += `<polyline fill="none" stroke="${s.c}" stroke-width="2.2" points="${s.v.map((v, k) => `${x(k)},${y(v)}`).join(' ')}"/>`;
  return `<svg viewBox="0 0 ${W} ${Ht}" width="100%" role="img" aria-label="Scores after each auction" style="margin-top:10px">${out}</svg><div class="legend">${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}

// ---------- Game logs (U11) ----------
const LOG_KEY = 'ss-games-v1';
function loadLocalGames() { try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch { return []; } }

function recordGame(r, g, type) {
  const humans = g.players.filter(p => p.agent === HumanAgent || p.agent === RemoteAgent).length;
  const rec = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), at: new Date().toISOString(),
    seed: r.seed, version: r.rulesVersion, n: g.n, hasBot: g.hasBot, botScoring: g.botRules.scoring,
    humans, bots: g.n - humans, names: g.players.map(p => p.name),
    scores: [...r.players.map(p => [p.name, p.score]), ...(r.bot && r.bot.scoring !== false ? [['Deck Bot', r.bot.score]] : [])].sort((a, b) => b[1] - a[1]),
    winner: r.winners.map(i => r.players[i].name).join(' and '), type, table: ui.online.code || null, feedback: false,
    result: { ...r, decisions: undefined }, replay: r.decisions && ui.online.role !== 'guest' ? JSON.parse(replayJSON(r, g)) : null,
  };
  ui.lastRecordId = rec.id;
  const list = loadLocalGames(); list.unshift(rec); saveLocalGames(list);
  if (hosted && ui.online.role !== 'guest') fetch('games.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'save', record: rec }) }).catch(() => { });

async function loadServerGames() {
  const L = ui.logs; L.err = null; L.loading = true; render();
  try {
    const res = await fetch('games.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'list', password: L.pw }) });
    const j = await res.json();

  } catch (e) { L.server = null; L.err = e.message === 'bad password' ? 'That password is not right.' : e.message === 'not configured' ? 'Set $REVIEW_PASSWORD in feedback.php first.' : 'The game list could not be loaded.'; }

}

async function fbSend() {

  const entry = { name: f.name.trim().slice(0, 100), email: f.email.trim().slice(0, 200), best: f.best.trim(), change: f.change.trim(), confused: f.confused.trim(), other: f.other.trim(), website: f.website, meta: fbMeta() };

  try {
    if (window.claude?.use) {

      const uid = user ? await user.id() : null;
      if (!db || !uid) throw new Error('unavailable');

      delete entry.website;
      const ts = Date.now();
      try {
        await db.doc(`feedback/${uid}`).set({ name: entry.name, last: ts });
        await db.doc(`feedback/${uid}/entries/e${ts}`).set({ ...entry, received: new Date(ts).toISOString() });
      } catch (e) {

      }
